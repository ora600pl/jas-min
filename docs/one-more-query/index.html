 exampleTitle:t('Wynik Q95 dla danych kursu','Q95 result for the course data'),example:t('W uruchomieniu JAS-MIN na danych kursu Q95 wykonało ','In the JAS-MIN run on the course data, Q95 ran for ')+n(D.fitStatus.quantile.iterations,0)+t(' kroków poprawiania rozwiązania (iteracji), ale nie spełniło warunków zakończenia obliczeń. JAS-MIN liczy też inne modele: Ridge, Elastic Net i Hubera. Porównując ich wskazania, nadaje oczekiwaniom etykiety opisujące zgodność wyników. Niedokończone Q95 — takie dopasowanie nazywamy niezbieżnym — jest z tego porównania wykluczone. Przykłady dydaktyczne wyjaśniają metodę; nie są potwierdzeniem jakości tego dopasowania.',' steps of improving the solution (iterations), without meeting its stopping conditions. JAS-MIN also fits other models: Ridge, Elastic Net and Huber. Comparing their indications assigns waits labels describing agreement between results. The unfinished Q95 result, called a non-converged fit, is excluded from final classification. The teaching examples explain the method; they do not establish the quality of this fit.'),remember:t('Średnia pyta o przeciętność. Q95 pyta o wysoki wynik w podobnej sytuacji.','The mean asks about the average. Q95 asks about a high outcome in a similar situation.'),limit:t('Przewidywany poziom trzeba sprawdzić na późniejszych danych, także osobno dla różnych warunków pracy. Nawet dobre prognozy wskazują związki między zmianami oczekiwań a wysokimi zmianami AAS, a nie dowiedzione przyczyny przeciążenia.','Check the predicted level on later data, including different operating conditions separately. Even good predictions reveal associations between wait changes and high AAS changes, not proven causes of overload.'),
 math:[t('Pełna nazwa tego oszacowania to kwantyl warunkowy 0,95. „Warunkowy” oznacza, że zależy on od zmian czasu oczekiwań podanych modelowi. Przy innych oczekiwaniach odpowiedź może być inna.','The full name for this estimate is the conditional 0.95 quantile. “Conditional” means it depends on the wait-time changes supplied to the model. Different wait-time changes can give a different answer.'),t('Niedoszacowanie (prognozę za niską) mnożymy przez 0,95, a przeszacowanie (prognozę za wysoką) przez 0,05. Stosunek 0,95 / 0,05 = 19 oznacza, że jedno zaniżenie o 1 AAS daje tyle punktów co 19 zawyżeń o 1 AAS. To proporcja 5 do 95, pokazana w przykładzie ze 100 polami. Sumujemy punkty ze wszystkich pomiarów. Pełna implementacja dodaje regularyzację ograniczającą wielkość mnożników. Ćwiczenie poniżej pokazuje samą asymetrię, bez tego dodatku.','Multiply an underestimate by 0.95 and an overestimate by 0.05. The ratio 0.95 / 0.05 = 19 means that one 1-AAS underestimate scores as much as nineteen 1-AAS overestimates. That is the 5-to-95 balance shown by the 100-cell example. Sum the scores from all observations. The full implementation adds regularization limiting multiplier size. The exercise below isolates the asymmetry without that addition.')]}

function settings(key,lang,D){
 const t=(pl,en)=>lang==='pl'?pl:en,n=(v,d=6)=>new Intl.NumberFormat(lang==='pl'?'pl-PL':'en-GB',{maximumFractionDigits:d}).format(v),p=s=>'<p>'+s+'</p>';
 let body;
 if(key==='ridge')body=p(t('<strong>λ ustawiasz; mnożniki β są wyliczane.</strong> JAS-MIN domyślnie używa λ = 0,05. Możesz podać inną wartość przez <code>--ridge-lambda</code>. Program nie szuka automatycznie najlepszej λ dla Ridge. Przy ustalonej λ rozwiązuje równania i wylicza wszystkie β.','<strong>You set λ; the β multipliers are fitted.</strong> JAS-MIN uses λ = 0.05 by default. Supply another value with <code>--ridge-lambda</code>. It does not automatically search for the best Ridge λ. With λ fixed, it solves the equations for all β.'))+
  p(t('W kursie suwak w rozdziale „Sygnał” zmienia właśnie λ i przelicza Ridge na prawdziwych danych. Startowe 0,05 jest wartością domyślną, a nie zwycięzcą sprawdzianu na późniejszych pomiarach.','In this course, the “Signal” slider changes λ and refits Ridge on the authentic data. The initial 0.05 is the default, not the winner of a test on later observations.'));
 else if(key==='elastic')body=p(t('<strong>Domyślnie JAS-MIN dobiera λ z danych.</strong> Uczy modele na wcześniejszych oknach i sprawdza ich przewidywania na późniejszych. Próbuje różnych wartości λ, zamiast wybierać λ na podstawie samego trafienia w dane treningowe.','<strong>By default, JAS-MIN selects λ from the data.</strong> It trains models on earlier windows and checks their predictions on later ones. It tries different λ values instead of choosing λ from training fit alone.'))+
  p(t('<strong>α ustawia użytkownik; domyślnie α = 0,2.</strong> α rozdziela dodatek: część L1 może zerować mnożniki, część L2 ogranicza ich wielkość. Opcja <code>--en-alpha</code> zmienia tę proporcję. Podanie <code>--en-lambda</code> wyłącza automatyczny dobór λ i narzuca wskazaną wartość.','<strong>The user sets α; its default is 0.2.</strong> α splits the addition: L1 can zero multipliers, while L2 limits their size. <code>--en-alpha</code> changes this balance. Supplying <code>--en-lambda</code> bypasses automatic λ selection and fixes the supplied value.'))+
  p(t('Podczas jednego dopasowania λ i α pozostają stałe. Zmieniają się β i przewidywania. Nowy zestaw danych może dać inną automatycznie dobraną λ. W zapisanym wyniku kursu: λ = ','Within one fit, λ and α stay fixed. β and predictions change. A new dataset can produce a different automatically selected λ. The course’s saved result uses λ = ')+n(D.parameters.enLambda)+'; α = '+n(D.parameters.enAlpha)+t('. Przeglądarka odczytuje ten wynik — nie uruchamia ponownie jego doboru.','. The browser reads this result; it does not rerun its selection.'))+
  '<details class="parameter-details"><summary>'+t('Jak program porównuje ustawienia?','How does the program compare settings?')+'</summary>'+
  p(t('Najpierw wylicza λ maksymalne: najmniejszą siłę dodatku, przy której wszystkie mnożniki mogą pozostać zerowe. Następnie sprawdza 40 poziomów siły regularyzacji, od tej granicy do wartości 1000 razy mniejszej. Zakres zależy od danych. W maksymalnie pięciu sprawdzianach uczy się na początku szeregu i przewiduje następny fragment. Do każdego sprawdzianu skalę wejść i celu wylicza tylko z części treningowej.','First it computes the maximum λ: the smallest penalty strength at which all multipliers can remain zero. It then tests 40 regularization strengths from that boundary down to a value 1,000 times smaller. The range depends on the data. In up to five checks, it learns from the beginning of the series and predicts the next block. Each check scales inputs and the target using only its training portion.'))+
  p(t('Porównuje średnie kwadraty błędów na późniejszych, przeskalowanych danych: mniej = lepiej. Z ustawień bliskich najlepszemu wybiera najsilniejsze upraszczanie. „Bliskie” oznacza tu: wynik nie gorszy niż najlepsza średnia plus jeden błąd standardowy tej średniej, oszacowany z wyników sprawdzianów. To reguła one-standard-error. Sprawdziany wybierają proporcję względem maksymalnej λ, liczonej osobno dla ich danych treningowych. Końcowa λ to wybrana proporcja × maksymalna λ z całego zbioru. Przy niej program dopasowuje końcowe β.','It compares mean squared errors on the later, scaled data: lower is better. Among settings close to the best result, it selects the strongest simplification. “Close” means no worse than the best mean plus one standard error of that mean, estimated from the validation results. This is the one-standard-error rule. Validation selects a ratio relative to the maximum λ, calculated separately on each training portion. The final λ is that ratio × the full dataset’s maximum λ. The program fits its final β at that value.'))+
  p(t('Zapis obliczeń dołączony do kursu ma pięć podziałów w czasie, ale nie zawiera wszystkich ocen kandydatów. Dlatego pokazujemy wybraną λ, nie odtwarzamy tutaj całego sprawdzianu. Gdy danych jest za mało do sprawdzianów, kod używa reguły zastępczej: 0,05 × λ maksymalne. Stały cel lub zerowy sygnał wszystkich wejść daje λ = 0.','The calculation record included in the course has five chronological splits but not every candidate score. We therefore show the selected λ without replaying the entire validation. When validation data are insufficient, the code falls back to 0.05 × the maximum λ. A constant target or zero signal from every input gives λ = 0.'))+'</details>';
 else if(key==='huber')body=p(t('<strong>Próg δ program wylicza z danych, przed dopasowaniem.</strong> W JAS-MIN jest to 1,345 × MAD zmian AAS. MAD opisuje typową odległość od środka tych zmian; szczegółowy rachunek jest poniżej. Dla danych kursu: 1,345 × 2,4 = 3,228 AAS.','<strong>The program calculates threshold δ from the data before fitting.</strong> JAS-MIN uses 1.345 × the MAD of AAS changes. MAD describes a typical distance from the centre of those changes; the calculation is below. For the course data: 1.345 × 2.4 = 3.228 AAS.'))+
  p(t('W kolejnych krokach δ już się nie zmienia. Zmieniają się mnożniki, przewidywania, błędy i wynikające z nich wagi pomiarów. Program dodaje też karę Ridge za wielkość mnożników; siła tego dodatku to λ (lambda), tutaj 0,05. Suwak ćwiczenia pozwala porównać inne progi na pięciu wymyślonych pomiarach; nie zmienia progu modelu zapisanego dla danych kursu.','δ then stays fixed through the fitting steps. Multipliers, predictions, errors and the resulting observation weights change. The program also adds a Ridge penalty on multiplier size; its strength is λ (lambda), here 0.05. The exercise slider compares thresholds on five invented observations; it does not alter the saved course-data model’s threshold.'));
 else body=p(t('<strong>Poziom kwantyla jest ustawiony w kodzie: τ (tau) = 0,95.</strong> Prognoza ma postać: wyraz wolny + suma przeskalowanych zmian oczekiwań pomnożonych przez ich mnożniki β. Wyraz wolny jest punktem wyjścia prognozy, a każdy mnożnik określa, jak jedno oczekiwanie przesuwa wynik. JAS-MIN wylicza te liczby z danych. Skalowanie wejścia polega na odjęciu średniej zmiany i podzieleniu przez odchylenie standardowe. Podczas dopasowania skalowany jest również cel, czyli zmiana AAS. Średnia punktów to ich suma podzielona przez liczbę pomiarów. Bez kary suma i średnia wybierają tę samą prognozę. Do średniej program dodaje λ × sumę kwadratów mnożników / 2; to kara L2. λ = 0,0005 jest stałym ustawieniem programu. Ogranicza używanie dużych mnożników; ich końcowe wartości i prognozy wracają do jednostek AAS.','<strong>The quantile level is fixed in the code: τ (tau) = 0.95.</strong> The prediction is an intercept plus the sum of scaled wait changes multiplied by their β multipliers. The intercept is the prediction’s starting value; each multiplier sets how one wait moves the result. JAS-MIN fits these numbers from the data. Each input is scaled by subtracting its mean change and dividing by its standard deviation. The target, the AAS change, is also scaled during fitting. The mean error score is the sum divided by the number of observations. Without a penalty, sum and mean select the same prediction. The program adds λ × the sum of squared multipliers / 2 to the mean error score: the L2 penalty. λ = 0.0005 is a fixed program setting. It restrains large multipliers; the final coefficients and predictions return to AAS units.'))+
  p(t('Podczas dopasowania model porównuje przewidywania z pomiarami i poprawia mnożniki, aby zmniejszać łączną ocenę. Warunki zakończenia sprawdzają, czy obliczenia doszły dostatecznie blisko rozwiązania. Dopiero osobne sprawdzenie na późniejszych oknach pokazuje, czy model dobrze przewiduje wysoki poziom zmian.','During fitting, the model compares predictions with observations and adjusts the multipliers to reduce the total score. Stopping conditions check whether the calculation is close enough to a solution. A separate check on later windows is needed to see whether it predicts high changes well.'));
 return '<section class="intuition-check model-settings" data-settings="'+key+'"><h3>'+t('A jak ustawia to JAS-MIN?','How does JAS-MIN set this?')+'</h3>'+body+'</section>';
}

(function(root){
'use strict';
const M=root.DistilleryMath;
function words(lang){return {t:(pl,en)=>lang==='pl'?pl:en,n:(v,d=3)=>new Intl.NumberFormat(lang==='pl'?'pl-PL':'en-GB',{maximumFractionDigits:d}).format(v)};}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p=s=>'<p>'+s+'</p>',eq=s=>'<div class="worked-equation">'+s+'</div>';
function steps(items){return '<ol class="worked-steps">'+items.map(([title,body])=>'<li><h4>'+title+'</h4>'+body+'</li>').join('')+'</ol>';}
function slider(label,min,max,step,value){return '<div class="lab-field"><label for="model-lab-slider">'+label+'</label><input id="model-lab-slider" type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+value+'"></div><div id="model-lab-result" aria-live="polite" aria-atomic="true"></div>';}
function lab(key,lang,D,P){
 const {t,n}=words(lang),h=M.huberThreshold(P);
 let title,body;
 if(key==='ridge'){
  title=t('Jak dodatek za wielkość mnożników trafia do równania?','How does the multiplier-size addition enter the equation?');
  body=p(t('W ćwiczeniu z oczekiwaniami A i B oba przepisy idealnie odtwarzały trzy zapisane pomiary. Ich błąd dopasowania wynosił zero. Różniła je wrażliwość na rozchodzenie się A i B. Teraz zobacz, jak reguła Ridge ocenia te dwa przepisy.','In the A/B wait exercise both recipes exactly reproduced the three recorded observations. Their fitting error was zero. What differed was their sensitivity when A and B moved apart. Now see how the Ridge rule scores these two recipes.'))+
   steps([[t('Policz błąd na zapisanych pomiarach','Calculate error on recorded observations'),eq(t('średnia kwadratów (pomiar − prognoza) / 2','mean of squared (observation − prediction) / 2'))+p(t('Kwadraty sprawiają, że chybienie w górę i w dół się nie kasują. W obu naszych kandydatach ten składnik wynosi 0.','Squares prevent misses in opposite directions from cancelling. This term is 0 for both our candidates.'))],
   [t('Policz wielkość mnożników','Calculate the size of the multipliers'),eq('10² + (−9)² = 181')+eq(t('0,5² + 0,5² = 0,5','0.5² + 0.5² = 0.5'))+p(t('Duże przeciwstawne mnożniki dostają większy dodatek. To świadoma preferencja mniejszej wrażliwości, gdy podobny wynik można uzyskać spokojniejszym przepisem.','Large opposing multipliers receive a larger addition. This deliberately favours lower sensitivity when a calmer recipe can fit similarly well.'))],
   [t('Połącz obie oceny','Combine the two scores'),eq(t('ocena = błąd dopasowania + λ × suma kwadratów mnożników / 2','score = fitting error + λ × sum of squared multipliers / 2'))+p(t('Mniej punktów = lepiej: model szuka najmniejszej łącznej oceny. λ (lambda) określa siłę dodatku. Porównujemy kandydatów przy tej samej λ. Dzielenie przez 2 upraszcza późniejsze równania.','Fewer points = better: the model seeks the lowest total score. λ (lambda) sets the strength of the addition. Compare candidates at the same λ. Dividing by 2 simplifies later equations.'))]])+
   slider(t('Siła preferencji λ — tylko porównanie tych dwóch kandydatów','Preference strength λ — compare only these two candidates'),0,1,.05,.1)+

   p(t('Zmiana λ zmienia regułę oceny kandydatów. Sumy przy różnych λ nie służą do wyboru najlepszej λ: wyzerowanie dodatku samo obniża ocenę. Użyteczność ustawienia sprawdzamy przez błędy prognoz na późniejszych oknach, których model nie używał do nauki.','Changing λ changes the scoring rule for candidates. Totals at different λ values do not select the best λ: removing the penalty itself lowers the score. Test a setting’s usefulness through prediction errors on later windows the model did not learn from.'))+
   p(t('W pełnym rachunku z naszych danych jest 1 338 par i cztery mnożniki. Sumujemy kwadraty wszystkich błędów, dzielimy przez 2 × 1 338 i dodajemy λ × sumę kwadratów czterech mnożników / 2. Układ równań i eliminacja Gaussa w rozdziale „Sygnał” wyznaczają minimum tej oceny dla wybranej λ.','The full calculation on our data has 1,338 pairs and four multipliers. Sum all squared errors, divide by 2 × 1,338 and add λ × the sum of the four squared multipliers / 2. The equations and Gaussian elimination in “Signal” find the minimum of this score for the selected λ.'));
 }else if(key==='elastic'){
  title=t('Kiedy dodatkowy mnożnik pozostaje na zerze?','When does the extra multiplier stay at zero?');
  body=p(t('Wracamy do prognozy +10 AAS i pomiaru +10,6 AAS. Dodatkowe oczekiwanie ma przeskalowaną zmianę równą 1, więc jego mnożnik β dopisuje 1 × β. Nowa prognoza to 10 + β, a pomyłka to 10,6 − (10 + β) = 0,6 − β.','Return to the +10 AAS prediction and +10.6 AAS observation. The extra wait has a scaled change of 1, so its multiplier β adds 1 × β. The new prediction is 10 + β and the error is 10.6 − (10 + β) = 0.6 − β.'))+
   steps([[t('Zapisz ocenę kandydata','Write the candidate score'),eq(t('ocena = (0,6 − β)² / 2 + λ × 0,2 × |β| + λ × 0,8 × β² / 2','score = (0.6 − β)² / 2 + λ × 0.2 × |β| + λ × 0.8 × β² / 2'))+p(t('Pierwszy składnik ocenia pomyłkę. Drugi (L1) rośnie proporcjonalnie do wielkości mnożnika bez znaku. Trzeci (L2) rośnie z jego kwadratem. α = 0,2 oznacza, że przy L1 stoi 0,2 × λ, a przy L2 pozostałe 0,8 × λ. Mniej punktów = lepiej. Dzielenie kwadratów przez 2 to przyjęta konwencja rachunku: upraszcza regułę aktualizacji, w której próg L1 wynosi λ × α.','The first term scores the miss. The second (L1) grows in proportion to the multiplier’s unsigned size. The third (L2) grows with its square. α = 0.2 puts 0.2 × λ in front of L1 and the remaining 0.8 × λ in front of L2. Fewer points = better. Dividing the squared terms by 2 is the chosen convention: it simplifies the update rule so that the L1 threshold is λ × α.'))],
   [t('Podstaw λ = 4 i porównaj dwa mnożniki','Set λ = 4 and compare two multipliers'),

   '<div class="table-wrap"><table class="intuition-table en-arithmetic"><caption>'+t('Dwa warianty przy λ = 4, α = 0,2','Two candidates at λ = 4, α = 0.2')+'</caption><thead><tr><th>'+t('Co liczymy?','Calculation')+'</th><th>β = 0</th><th>'+t('β = 0,1','β = 0.1')+'</th></tr></thead><tbody>'+
   '<tr><th>'+t('Prognoza (AAS)','Prediction (AAS)')+'</th><td>10 + 0 = 10</td><td>'+t('10 + 0,1 = 10,1','10 + 0.1 = 10.1')+'</td></tr>'+
   '<tr><th>'+t('Pomyłka (AAS)','Error (AAS)')+'</th><td>'+t('10,6 − 10 = 0,6','10.6 − 10 = 0.6')+'</td><td>'+t('10,6 − 10,1 = 0,5','10.6 − 10.1 = 0.5')+'</td></tr>'+
   '<tr><th>'+t('Punkty za pomyłkę','Error score')+'</th><td>'+t('0,6² / 2 = 0,18','0.6² / 2 = 0.18')+'</td><td>'+t('0,5² / 2 = 0,125','0.5² / 2 = 0.125')+'</td></tr>'+
   '<tr><th>L1</th><td>'+t('0,8 × 0 = 0','0.8 × 0 = 0')+'</td><td>'+t('0,8 × 0,1 = 0,08','0.8 × 0.1 = 0.08')+'</td></tr>'+
   '<tr><th>L2</th><td>'+t('1,6 × 0² = 0','1.6 × 0² = 0')+'</td><td>'+t('1,6 × 0,1² = 0,016','1.6 × 0.1² = 0.016')+'</td></tr>'+
   '<tr><th>'+t('Łączna ocena','Total score')+'</th><td>'+t('0,18 + 0 + 0 = 0,18','0.18 + 0 + 0 = 0.18')+'</td><td>'+t('0,125 + 0,08 + 0,016 = 0,221','0.125 + 0.08 + 0.016 = 0.221')+'</td></tr></tbody></table></div>'],
   [t('Oddziel poprawę prognozy od zmiany punktów','Separate prediction improvement from score changes'),
   p(t('Mnożnik 0,1 zmniejsza pomyłkę z 0,6 do 0,5 AAS: poprawa wynosi 0,1 AAS. Ocena tej pomyłki zmienia się inaczej, bo liczymy kwadrat podzielony przez 2:','Multiplier 0.1 reduces the miss from 0.6 to 0.5 AAS: an improvement of 0.1 AAS. Its score changes differently because we square it and divide by 2:'))+
   eq(t('Ubywa punktów za pomyłkę: 0,18 − 0,125 = 0,055','Error points saved: 0.18 − 0.125 = 0.055'))+

function chart(curves,{xmax,ymax,xlabel,ylabel,marker,threshold}){
 const x=v=>42+v/xmax*330,y=v=>160-v/ymax*120;
 return '<svg class="lab-chart" viewBox="0 0 400 200" role="img" aria-label="'+esc(ylabel+' / '+xlabel)+'"><path class="lab-axis" d="M42 32 V160 H377"/>'+curves.map(c=>'<path fill="none" stroke="'+c.color+'" stroke-width="2.5" d="'+Array.from({length:101},(_,i)=>{const v=i/100*xmax;return(i?'L':'M')+x(v).toFixed(2)+','+y(c.fn(v)).toFixed(2);}).join('')+'"/>').join('')+(threshold===undefined?'':'<path class="lab-guide" d="M'+x(threshold)+' 32 V160"/><text x="'+x(threshold)+'" y="24" text-anchor="middle">δ</text>')+(marker?'<circle cx="'+x(marker.x)+'" cy="'+y(marker.y)+'" r="5" fill="currentColor"/>':'')+'<text x="30" y="176">0</text><text x="372" y="176" text-anchor="end">'+xmax+'</text><text x="42" y="17">'+esc(ylabel)+'</text><text x="205" y="195" text-anchor="middle">'+esc(xlabel)+'</text></svg>';
}
function result(key,value,lang,D,routineCount=4){
 const {t,n}=words(lang);
 if(key==='ridge'){
  const first=value*181/2,second=value*.5/2;
  return '<div class="lab-readout">λ = '+n(value)+'</div><div class="lab-comparison"><div><h4>10 × A − 9 × B</h4>'+eq('0 + '+n(value)+' × 181 / 2 = '+n(first))+p(t('błąd dopasowania + dodatek','fitting error + addition'))+'</div><div><h4>'+t('0,5 × A + 0,5 × B','0.5 × A + 0.5 × B')+'</h4>'+eq('0 + '+n(value)+' × '+n(.5)+' / 2 = '+n(second))+p(t('błąd dopasowania + dodatek','fitting error + addition'))+'</div></div>'+p(value===0?t('Remis na historii. Te same trafienia nie określają reakcji na nową sytuację.','A tie on history. Identical hits do not determine the response to a new situation.'):t('Ridge preferuje niższą ocenę — z tych dwóch kandydatów wybiera więc drugi. To wybór według reguły dopasowania, jeszcze nie sprawdzian prognoz na nowych danych.','Ridge prefers the lower score, so it chooses the second of these two candidates. This is a choice under the fitting rule, not yet a test of predictions on new data.'));
 }
 if(key==='elastic'){
  const r=M.elasticSettingsToy(value),candidates=[...new Set([0,.6,r.beta])];
  return '<div class="lab-readout">λ = '+n(value)+' · '+t('próg L1 = ','L1 threshold = ')+n(r.l1)+' · β = <strong>'+n(r.beta,4)+'</strong></div>'+
   '<div class="lab-comparison">'+candidates.map((b,i)=>{const error=(.6-b)**2/2,l1=r.l1*Math.abs(b),l2=r.l2*b*b/2;return '<div'+(b===r.beta?' class="lab-winner"':'')+'><h4>'+[t('Wyłączone: β = 0','Off: β = 0'),t('Idealne trafienie: β = 0,6','Perfect fit: β = 0.6'),t('Najniższa ocena przy tej λ','Lowest score at this λ')][i]+(i<2&&b===r.beta?t(' — najniższa ocena',' — lowest score'):'')+'</h4>'+eq('β = '+n(b,4))+eq(n(error,5)+' + '+n(l1,5)+' + '+n(l2,5)+' = '+n(error+l1+l2,5))+p(t('punkty za pomyłkę + L1 + L2 = razem','error score + L1 + L2 = total'))+'</div>';}).join('')+'</div>'+
   p(r.beta===0?t('Próg ≥ 0,6: dokładne zero ma najniższą ocenę. Prognoza: 10; pomiar: 10,6.','Threshold ≥ 0.6: exact zero has the lowest score. Prediction: 10; observation: 10.6.'):t('Próg < 0,6: zostaje dodatni mnożnik. Dla pomiaru 10,6 prognoza wynosi ','Threshold < 0.6: a positive multiplier remains. For the observation of 10.6, the prediction is ')+n(r.prediction,4)+'.');
 }
 if(key==='huber'){
  const delta=D.parameters.huberDelta,r=M.huberPoint(value,delta);
  return '<div class="lab-readout">|r| = '+n(value)+' AAS '+(value<=delta?'≤':' >')+' δ = '+n(delta)+' AAS</div>'+chart([{color:'#756c5c',fn:x=>x*x/2},{color:'#21574e',fn:x=>M.huberPoint(x,delta).loss}],{xmax:12,ymax:72,xlabel:t('wielkość błędu |r| (AAS)','error magnitude |r| (AAS)'),ylabel:t('punkty błędu','error score'),marker:{x:value,y:r.loss},threshold:delta})+
   '<div class="lab-legend"><span>━ '+t('Szary: zwykły kwadrat / 2','Grey: ordinary square / 2')+'</span><strong>━ Huber</strong></div>'+eq(t('punkty za zwykły kwadrat: ','ordinary squared-error score: ')+n(value)+'² / 2 = '+n(r.squared))+eq('Huber: '+(value<=delta?n(value)+'² / 2':n(delta)+' × ('+n(value)+' − '+n(delta)+' / 2)')+' = '+n(r.loss))+eq(t('waga: ','weight: ')+(value<=delta?'1':n(delta)+' / '+n(value)+' = '+n(r.weight)))+
   p(value<=delta?t('Poniżej progu obie krzywe się pokrywają. Pomiar bierze udział z pełną wagą.','Below the threshold the two curves coincide. The observation receives full weight.'):t('Powyżej progu zielona krzywa nadal rośnie, ale już po prostej. Podwojenie dużego błędu nie mnoży jego punktów przez cztery. Jego punkty rosną dalej, tylko wolniej.','Above the threshold the green curve keeps rising, but in a straight line. Doubling a large error no longer quadruples its score. Its score keeps growing, only more slowly.'))+
   p(value<=delta?t('Do progu nacisk rośnie razem z błędem: wynosi ','Up to the threshold, pressure grows with the error: it is ')+n(r.pressure)+'.':t('Powyżej progu nacisk tej reszty zatrzymuje się na δ = ','Above the threshold, this residual’s pressure stops at δ = ')+n(delta)+t(', zamiast wynosić ', ', rather than ')+n(value)+t(' jak przy zwykłym kwadracie.',' as with ordinary squared loss.'));
 }
 const q=M.quantileToy(value,routineCount),scenario=routineCount===4?t('Raz na 5: najmniejszy koszt przy prognozie 30 AAS.','1 in 5: lowest cost at a prediction of 30 AAS.'):routineCount===19?t('Raz na 20: wszystkie prognozy od 10 do 30 mają ten sam koszt 19. Płaskie dno — nie jeden wybrany wynik.','1 in 20: every prediction from 10 to 30 has the same cost of 19. A flat bottom, not one unique answer.'):t('Raz na 21: najmniejszy koszt przy 10 AAS, mimo że maksimum nadal wynosi 30. Q95 nie jest maksimum.','1 in 21: lowest cost at 10 AAS, although the maximum is still 30. Q95 is not the maximum.');
 return '<div class="lab-readout">'+t('Przewidujesz ','You predict ')+n(value)+' AAS → '+t('łączny koszt ','total cost ')+'<strong>'+n(q.total)+'</strong></div>'+chart([{color:'#21574e',fn:x=>M.quantileToy(x,routineCount).total}],{xmax:40,ymax:M.quantileToy(0,routineCount).total*1.05,xlabel:t('przewidywana zmiana (AAS)','predicted change (AAS)'),ylabel:t('łączny koszt','total cost'),marker:{x:value,y:q.total}})+p(scenario)+
  '<div class="lab-costs">'+(routineCount===4?q.observations.map((y,i)=>'<div><span>'+t('Pomiar ','Observation ')+(i+1)+': '+y+' AAS</span><b>'+n(y>=value?.95:.05)+' × '+n(Math.abs(y-value))+' = '+n(q.costs[i])+'</b><small>'+t(value<y?'za nisko':value>y?'za wysoko':'trafiony',value<y?'too low':value>y?'too high':'exact')+'</small></div>').join(''):'<div><span>'+routineCount+' × 10 AAS</span><b>'+routineCount+' × '+n(q.costs[0])+' = '+n(routineCount*q.costs[0])+'</b></div><div><span>1 × 30 AAS</span><b>'+n(q.costs.at(-1))+'</b></div>')+'</div>';
}
function bindLab(key,lang,D){
 const input=document.getElementById('model-lab-slider'),output=document.getElementById('model-lab-result');
 const frequency=document.getElementById('q-frequency');
 const update=value=>{output.innerHTML=result(key,value,lang,D,frequency?+frequency.value:4);input.setAttribute('aria-valuetext',words(lang).n(value,4));};
 input.oninput=()=>{update(+input.value);if(key==='elastic'){const plain=document.getElementById('intuition-slider');plain.value=input.value;plain.setAttribute('aria-valuetext',words(lang).n(+input.value));document.getElementById('intuition-result').innerHTML=root.ModelIntuition.result(key,+input.value,lang);}};
 document.querySelectorAll('[data-lab-value]').forEach(b=>b.onclick=()=>{const value=+b.dataset.labValue;input.value=value;update(value);});
 if(frequency)frequency.onchange=()=>update(+input.value);
 const meanButton=document.querySelector('[data-q-mean]');if(meanButton)meanButton.onclick=()=>{const count=+frequency.value,value=(10*count+30)/(count+1);input.value=value;update(value);};
 update(+input.value);
}
function metricGuide(lang,metric){
 const {t}=words(lang),cut=metric==='p90'?90:metric==='p99'?99:100;
 const meaning=metric==='p90'?t('P90: wielkość, której nie przekracza około 90% zmian danego oczekiwania. Większe skoki są w pozostałych około 10%.','P90: a magnitude that roughly 90% of changes in this wait do not exceed. Larger jumps are in the remaining roughly 10%.'):metric==='p99'?t('P99: wielkość, której nie przekracza około 99% zmian danego oczekiwania. Przyglądamy się rzadkim, dużym skokom.','P99: a magnitude that roughly 99% of changes in this wait do not exceed. We are looking at rare, large jumps.'):t('MAX: największa zaobserwowana bezwzględna zmiana danego oczekiwania — nawet jeśli zdarzyła się tylko raz.','MAX: the largest observed absolute change in this wait, even if it happened only once.');
 return '<section class="percentile-guide"><h3>'+t('Jak duży skok bierzemy pod lupę?','How large a jump are we examining?')+'</h3>'+p(meaning)+'<details id="percentile-details"><summary>'+t('Pokaż P90, P99 i MAX na kolejce 101 zmian','Show P90, P99 and MAX in a queue of 101 changes')+'</summary>'+p(t('Najpierw policz zmianę między sąsiednimi pomiarami i odrzuć jej znak: −20 s i +20 s to skok tej samej wielkości. Dopiero kopię tych wielkości ustaw w kolejce od najmniejszej do największej.','First calculate each change between adjacent observations and remove its sign: −20 s and +20 s are equally large changes. Only then sort a copy of those magnitudes from smallest to largest.'))+
  '<div class="percentile-queue" role="img" aria-label="'+t('Ilustracja: 101 uporządkowanych wielkości, wybrano ','Illustration: 101 sorted magnitudes, selected ')+metric.toUpperCase()+'">'+Array.from({length:101},(_,i)=>'<i class="'+(i===cut?'selected':i<cut?'before':'')+'"></i>').join('')+'</div><p class="micro">'+t('Każda kreska = jeden wpis. Kolor pokazuje pozycję, nie wysokość wartości.','Each mark = one entry. Colour shows position, not value height.')+'</p>'+
  p(t('Wyobraź sobie 101 zmian: 0, 1, 2, …, 99 i na końcu jeden potwór 1 000 sekund. To wymyślona kolejka do nauki, nie nasze pomiary.','Imagine 101 changes: 0, 1, 2, …, 99 and one monster of 1,000 seconds at the end. This is an invented teaching queue, not our measurements.'))+
  '<dl class="metric-definitions"><div><dt>P90 = 90 s</dt><dd>'+t('Granica około 90% uporządkowanej listy; w tej miniaturze wpis nr 91. Około 10% zmian jest większych.','A boundary around 90% of the sorted list; entry 91 in this miniature. Roughly 10% of changes are larger.')+'</dd></div><div><dt>P99 = 99 s</dt><dd>'+t('Granica około 99%; tu wpis nr 100. Patrzymy znacznie bliżej skrajnych skoków.','A boundary around 99%; entry 100 here. We look much closer to the extreme jumps.')+'</dd></div><div><dt>MAX = 1 000 s</dt><dd>'+t('Największy zaobserwowany skok, choćby zdarzył się tylko raz. Nie największy możliwy skok w przyszłości.','The largest observed jump, even if it happened only once. Not the largest possible future jump.')+'</dd></div></dl>'+
  p(t('Jeden gość zamawiający sto piw nie mówi, ile zamawia zwykły stolik. Ale nie wolno udawać, że gościa nie było. Dlatego oglądamy kilka skal, zamiast wybierać jedną „prawdziwą”.','One guest ordering a hundred beers does not tell you what an ordinary table orders. But you cannot pretend the guest never arrived. That is why we inspect several scales instead of choosing one “true” measure.'))+
  p(t('P90/P99 wybierają rozmiar zmiany oczekiwania na wejściu. Q95 to osobny model: szacuje poziom zmiany AAS, którego nie powinno przekraczać około 95% wyników przy podobnych wejściach. AAS opisuje średnią liczbę aktywnych sesji w oknie; czas pojedynczego SQL wymaga innych danych.','P90/P99 select input wait-change magnitudes. Q95 is a separate model: it estimates an AAS-change level that roughly 95% of outcomes should not exceed for similar inputs. AAS describes average active sessions in a window; individual SQL time requires other data.'))+'</details></section>';
}
function rankingGuide(lang,model,metric){
 const {t}=words(lang),names={ridge:'Ridge',elastic:'Elastic Net',huber:'Huber',quantile:'Q95'};
 const descriptions={
 ridge:t('Ridge dopasowuje przeciętną zmianę AAS, ograniczając łączną wielkość mnożników.','Ridge fits the average AAS change while limiting overall multiplier size.'),
 elastic:t('Elastic Net dopasowuje zmianę AAS i może nadać części oczekiwań mnożnik zero.','Elastic Net fits AAS change and can give some waits a multiplier of zero.'),
 huber:t('Huber ogranicza wpływ dużych pomyłek prognozy na dopasowanie.','Huber limits the influence of large prediction errors on the fit.'),
 quantile:t('Q95 szacuje poziom zmiany AAS, którego nie powinno przekraczać około 95% wyników przy podobnych zmianach oczekiwań. W tej próbce jego obliczenia nie spełniły warunków zakończenia.','Q95 estimates an AAS-change level that roughly 95% of outcomes should not exceed for similar wait changes. Its calculation did not meet the stopping conditions in this sample.')
 };
 return '<section class="ranking-guide"><h3>'+t('Dwie decyzje, jedno pytanie','Two choices, one question')+'</h3>'+p(t('<strong>Model</strong> wybiera sposób dopasowania związku. <strong>P90 / P99 / MAX</strong> wybiera rozmiar zmiany każdego oczekiwania, dla którego obliczamy odpowiedź tego modelu.','<strong>Model</strong> selects how to fit the relationship. <strong>P90 / P99 / MAX</strong> selects each wait’s change magnitude at which we calculate that model’s response.'))+
 p('<strong>'+names[model]+':</strong> '+descriptions[model])+
 p(t('Słupek odpowiada: o ile zmieniłaby się prognoza, gdyby to jedno oczekiwanie wzrosło o wybrany rozmiar, a pozostałe się nie zmieniły? Większy dodatni wynik daje wcześniejszy trop do sprawdzenia.','Each bar asks: how far would the prediction move if this one wait rose by the chosen magnitude while the others stayed the same? A larger positive result gives an earlier lead to investigate.'))+
 '<button type="button" id="signal-model-explain" aria-haspopup="dialog" aria-controls="model-dialog">'+t('Wyjaśnij model ','Explain ')+names[model]+' 🍺</button>'+
 (model==='ridge'?'<details><summary>'+t('Czym Ridge × P99 różni się od Q95?','How does Ridge × P99 differ from Q95?')+'</summary>'+p(t('P99 wybiera duży skok oczekiwania na wejściu. Ridge nadal oblicza przesunięcie swojej prognozy przeciętnej zmiany AAS. Q95 dopasowuje inny wzór: pyta o wysoki poziom wyniku AAS przy danych wejściach. Duży skok wejścia i wysoki poziom wyniku to dwa różne pytania.','P99 selects a large input wait change. Ridge still calculates a shift in its prediction of average AAS change. Q95 fits a different formula: it asks about a high AAS-change outcome for the inputs. A large input jump and a high output level are two different questions.'))+'</details>':'')+'</section>';
}
function provenance(lang,D,P,fit,model,metric,top){
 const {t,n}=words(lang),j=top.j,i=D.focus,ss=M.sum(P.dx.map(r=>(r[j]-P.mean[j])**2)),pct=M.percentileTrace(P.dx.map(r=>Math.abs(r[j])),metric==='p90'?.9:metric==='p99'?.99:1),ridge=model==='ridge';
 const others=ridge?M.sum(fit.A[j].map((a,k)=>k===j?0:a*fit.beta[k])):0;
 const missing=D.missingCounts[j],bound=Math.min(P.n,2*missing);
 const missingText=missing===0?t('Ta kolumna nie ma wpisów zastąpionych zerem. Dopasowanie korzysta jednak również z innych kolumn, które mają braki.','This column has no zero-filled entries. The fit also uses other columns with missing data.'):
 t('Wpisy tej kolumny zastąpione zerem: ','Zero-filled entries in this column: ')+n(missing,0)+t('. Nie znamy ich pozycji. Każdy taki wpis może wpłynąć na najwyżej dwie sąsiednie różnice — przed nim i po nim. Górna granica to więc ','. Their positions are unknown. Each entry can affect at most two adjacent differences, one before and one after it. The upper bound is therefore ')+n(bound,0)+t(' z ',' of ')+n(P.n,0)+t(' różnic; faktycznej liczby nie ustalimy bez pozycji braków. Sztuczne skoki mogą zmieniać skalę, percentyle i mnożniki.',' differences; their actual number needs the missing-entry positions. Artificial jumps can change scaling, percentiles and multipliers.');
 return '<section class="formula-panel provenance">'+(model==='quantile'?'<p class="provenance-excluded">'+t('Q95: przykład rachunku na wyniku, który nie przeszedł kontroli zakończenia obliczeń. Nie używamy go do etykiet podsumowujących zgodność modeli.','Q95: arithmetic using a result that failed the stopping checks. It is not used for labels summarising agreement between models.')+'</p>':'')+'<span class="tag">'+t('SKĄD TA LICZBA? · OD MNOŻNIKA DO SŁUPKA','WHERE DOES THIS NUMBER COME FROM? · FROM MULTIPLIER TO BAR')+'</span><h3>'+esc(top.name)+'</h3>'+
 p(t('Mnożnik po przeliczeniu na sekundy × wybrana wielkość skoku = wynik słupka. Dla tego oczekiwania:','Multiplier converted to seconds × chosen jump magnitude = bar score. For this wait:'))+
 eq((top.raw<0?'max(0; '+n(top.raw,8)+')':n(top.raw,8))+' AAS/s × '+n(top.magnitude)+' s ≈ '+n(top.impact)+' AAS')+
 p(model==='quantile'?t('Tutaj wynik opisuje przesunięcie prognozowanego wysokiego poziomu (Q95) zmiany AAS.','Here the score describes a shift in the predicted high level (Q95) of AAS change.'):t('Tutaj wynik opisuje przesunięcie zmiany AAS przewidywanej przez wybrany model.','Here the score describes a shift in the AAS change predicted by the selected model.'))+
 p(missingText)+
 '<details class="provenance-steps"><summary>'+t('Rozwiń sześć kroków: skąd mnożnik i rozmiar skoku?','Expand six steps: where do the multiplier and jump size come from?')+'</summary>'+steps([
  [t('Źródło: sąsiednie odczyty → 1 338 zmian','Source: adjacent readings → 1,338 changes'),p(t('Z 1 339 wierszy danych kursu odejmujemy każdy poprzedni od następnego. Np. para 447 → 448 dla tego oczekiwania:','From the course’s 1,339 rows, subtract each previous row from the next. For example, pair 447 → 448 for this wait:'))+eq(n(D.x[i+1][j])+' − '+n(D.x[i][j])+' = '+n(P.dx[i][j])+' s')+p(t('To pojedynczy przykład wejścia. Końcowy słupek używa wszystkich par, nie tylko tego skoku.','This is one input example. The final bar uses all pairs, not just this jump.'))],

function gaussIntro(lang,D,P,fit){const {t,n}=words(lang);return '<p>'+t('Szukamy czterech mnożników naraz. Każdy wiersz poniżej jest równaniem, które muszą wspólnie spełnić. Ostatnia kolumna to liczba po prawej stronie znaku równości, nie piąte zdarzenie.','We seek four multipliers together. Each row below is an equation they must jointly satisfy. The last column is the number to the right of the equals sign, not a fifth event.')+'</p><dl class="beta-key">'+D.features.map((name,j)=>'<div><dt>β'+(j+1)+'</dt><dd>'+esc(name)+'</dd></div>').join('')+'</dl><p>'+t('Przykład: pierwszy wiersz macierzy oznacza','Example: the first matrix row means')+'</p><div class="worked-equation">'+fit.A[0].map((v,j)=>'('+n(v,5)+') × β'+(j+1)).join(' + ')+' = '+n(fit.rhs[0],5)+'</div><p>'+t('Eliminacja Gaussa odejmuje wielokrotności jednego równania od drugiego, aby usuwać po jednej niewiadomej. To działa, bo odejmujemy równe wielkości od obu stron. Gdy w dolnym wierszu zostanie tylko jedna niewiadoma, wyliczymy ją i pójdziemy w górę.','Gaussian elimination subtracts a multiple of one equation from another to remove unknowns one at a time. This works because equal quantities are subtracted from both sides. Once the bottom row has just one unknown, we solve it and work upwards.')+'</p><details><summary>'+t('Skąd w ogóle te równania?','Where did these equations come from?')+'</summary><p>'+t('Wybieramy β tak, by zmniejszyć średni kwadrat pomyłki oraz dodatek za wielkie mnożniki. N to 1 338 par, z to przeskalowane zmiany zdarzeń, a yᶜ to zmiana AAS po odjęciu jej średniej. Symbol Σ znaczy „dodaj wszystkie wskazane składniki”.','We choose β to reduce average squared prediction error plus a cost for large multipliers. N is 1,338 pairs, z contains scaled event changes and yᶜ is AAS change minus its mean. Σ means “add up all the indicated terms”.')+'</p><pre class="tool-code">min: Σ(yᶜᵢ − zᵢ · β)² / (2N) + λ · Σβⱼ² / 2\n(ZᵀZ / N + λI) β = Zᵀyᶜ / N\nN = '+P.n+'; λ = '+n(fit.lambda)+'</pre><p>'+t('Indeks i oznacza parę sąsiednich okien; j i k wskazują oczekiwania od 1 do 4. Zapis zᵢ · β to suma zᵢ₁β1 + zᵢ₂β2 + zᵢ₃β3 + zᵢ₄β4: prognoza zmiany AAS po odjęciu średniej zmiany AAS. Aby wrócić do AAS, dodajemy tę średnią. Duża litera Z oznacza tabelę wszystkich z, a znak ᵀ zamienia jej wiersze z kolumnami. ZᵀZ / N to tabela 4 × 4: pozycja w wierszu j i kolumnie k jest średnią iloczynów kolumn j i k. Zᵀyᶜ / N to cztery średnie iloczynów danej kolumny i yᶜ. I to tabela z jedynkami na przekątnej i zerami poza nią, więc λI dodaje λ tylko na przekątnej. Układ powstaje, gdy wymagamy, aby bardzo mały ruch żadnego mnożnika nie obniżał już łącznej oceny. Dla dodatniej λ funkcja oceny ma kształt misy z jednym dnem: rozwiązanie układu wyznacza to minimum.','Index i identifies a pair of adjacent windows; j and k identify waits 1 to 4. The notation zᵢ · β means zᵢ₁β1 + zᵢ₂β2 + zᵢ₃β3 + zᵢ₄β4: the predicted AAS change after subtracting mean AAS change. Add that mean to return to AAS. Capital Z is the table of all z values, and ᵀ swaps its rows and columns. ZᵀZ / N is a 4 × 4 table: row j, column k contains the mean product of columns j and k. Zᵀyᶜ / N contains four mean products of each column and yᶜ. I has ones on the diagonal and zeros elsewhere, so λI adds λ only on the diagonal. The equations require that no tiny move of any multiplier reduces the total score. For positive λ the score is bowl-shaped with one bottom: the solution gives that minimum.')+'</p></details>';}

function apparatus(){return '<svg id="apparatus" class="distill-svg" viewBox="0 0 860 300" role="img" aria-label="'+t('Przepływ danych przez lokalne obliczenia, cztery modele i bramkę jakości','Data passing through local calculations, four models and the quality gate')+'"><title>'+t('Destylarnia dowodów','Evidence distillery')+'</title><path class="pipe" d="M158 135 H238 V78 H380 V137 H472 M472 137 H700 V195"/><path class="flow" d="M158 135 H238 V78 H380 V137 H472 H700 V195"/><rect x="24" y="79" width="139" height="132" rx="12" class="metal"/><path d="M25 124 H162 V199 Q162 211 150 211 H36 Q24 211 24 198Z" class="liquid"/><text x="93" y="115" text-anchor="middle" class="label">1 339 × 5</text><text x="93" y="152" text-anchor="middle">'+t('POMIARY','READINGS')+'</text><text x="93" y="174" text-anchor="middle">'+t('zostają lokalnie','stay local')+'</text><path class="copper" d="M270 173 Q260 114 295 91 L295 56 H329 V91 Q365 114 354 173 Q352 210 313 215 Q273 211 270 173Z"/><path class="metal" d="M285 216 H341 L352 235 H272Z"/><text x="312" y="133" text-anchor="middle" class="label">Δ → z</text><text x="312" y="155" text-anchor="middle">'+t('LOKALNIE','LOCALLY')+'</text><rect x="431" y="72" width="72" height="130" rx="10" class="metal"/><path d="M444 92 H490 L444 112 H490 L444 132 H490 L444 152 H490 L444 172 H490" stroke="#cd9959" stroke-width="3" fill="none"/><text x="466" y="230" text-anchor="middle">'+t('DOPASOWANIE','FITTING')+'</text>'+['Ridge','EN','Huber','Q95'].map((s,i)=>{const x=554+i*70;return '<path d="M'+x+' 155 V170 L'+(x-10)+' 184 V244 Q'+(x-10)+' 250 '+(x-4)+' 250 H'+(x+24)+' Q'+(x+30)+' 250 '+(x+30)+' 244 V184 L'+(x+20)+' 170 V155Z" class="bottle '+(i===3?'rejected':'')+'"/><rect x="'+(x-5)+'" y="210" width="30" height="31" rx="2" fill="'+(i===3?'#e88a8125':'#edb85c30')+'"/><text x="'+(x+10)+'" y="202" text-anchor="middle" class="'+(i===3?'danger-label':'label')+'">'+s+'</text><text x="'+(x+10)+'" y="277" text-anchor="middle" class="'+(i===3?'danger-label':'')+'">'+(i===3?'STOP':'✓')+'</text>';}).join('')+'<text x="25" y="275">'+t('CZTERY MODELE. RÓŻNE PYTANIA. ŻADNYCH WYROKÓW.','FOUR MODELS. DIFFERENT QUESTIONS. NO VERDICTS.')+'</text></svg>';}
function stages(){return [t('Jakość','Quality'),t('Różnice','Changes'),t('Skala','Scale'),t('Modele','Models'),t('Bramka','Gate'),t('Etykieta','Label')];}
function distil(){return intro(2,t('Nie wysyłaj beczki.<br><em>Najpierw destyluj sygnał.</em>','Don’t send the barrel.<br><em>Distil the signal first.</em>'),t('Liczby zostają na miejscu. Modele wyciągają użyteczne relacje. Na etykietę trafiają także wątpliwości — nie tylko mocne wnioski.','Keep the numbers local. Models extract useful relationships. Doubts go on the label too — not just confident-looking results.'))+
 '<div class="layout"><section class="panel"><div class="panel-head"><p class="eyebrow">'+t('JAS-MIN / LOKALNY PRZEPŁYW DANYCH','JAS-MIN / LOCAL DATA FLOW')+'</p><button id="play-flow">'+t('▶ Pokaż przepływ','▶ Show the flow')+'</button></div><p id="flow-status" class="flow-status" aria-live="polite"></p><div class="distillery">'+apparatus()+'<div class="stage-controls">'+stages().map((s,i)=>'<button data-stage="'+i+'" aria-pressed="'+(i===state.stage)+'"><span>0'+(i+1)+'</span>'+s+'</button>').join('')+'</div></div><div class="calc" id="calc-content" aria-live="polite">'+calcContent()+'</div></section><aside class="side-note"><div class="dialogue"><span class="speaker">DBA</span>'+t('„To nie magia. To matematyka z porządną etykietą.”','“Not magic. Maths with a proper label.”')+'</div>'+notice('<strong>Whisky z danych? Tak. Eliksir prawdy? Nie.</strong> Model streszcza wybrane relacje; nie zachowuje całej historii. Źródłowe obserwacje zostają dostępne. Braki nie znikają w rurce.','<strong>Data whisky? Yes. Truth serum? No.</strong> A model is a lossy description of selected relationships. Source observations remain available. Missing values do not vanish in the pipe.')+'<div class="fact"><b>1 338</b><span>'+t('par sąsiednich obserwacji','pairs of adjacent observations')+'</span></div><div class="fact"><b>4 → 3</b><span>'+t('modele w próbce → zakończone obliczenia; to nie certyfikat jakości danych','models in the sample → completed fits; not a data-quality certificate')+'</span></div><p class="subtle">'+t('Kliknij zawory. Dla różnic i skali śledzimy tę samą parę 447 → 448 i cursor: pin S wait on X.','Click the valves. Changes and scaling follow the same pair, 447 → 448, and cursor: pin S wait on X.')+'</p></aside></div>'+next(t('Co wyszło z tej destylacji?','What came out of the distillery?'));}
function calcContent(){const i=D.focus,j=1,dx=P.dx[i][j],dy=P.dy[i],z=P.z[i][j];switch(state.stage){
 case 0:return '<p class="eyebrow">'+t('01 / Najpierw etykieta wejścia','01 / Label the input first')+'</p><h2>'+t('Zero ≠ „nic się nie działo”.','Zero ≠ “nothing happened”.')+'</h2>'+warning()+'<p>'+t('W pozostałych kolumnach liczby braków to 0, 1 i 0. Maska wierszy oraz długości okien nie zachowały się. Nie oznaczamy żadnego konkretnego zera jako brakującego. Wyniki poniżej są rekonstrukcją edukacyjną obarczoną tym ograniczeniem.','Missing counts in the other columns are 0, 1 and 0. Row masks and window durations were not retained. We do not label any particular zero as missing. The following results are an educational reconstruction with this limitation.')+'</p><details><summary>'+t('Dlaczego braki mogą stworzyć fałszywy skok?','How can missing data create a false spike?')+'</summary><p>'+t('Ogólny przykład algebraiczny, nie oznaczenie wiersza tego zbioru: jeśli brakujące xₜ zastąpisz zerem, różnice na krawędziach luki stają się 0 − xₜ₋₁ oraz xₜ₊₁ − 0. Bez maski nie odróżnimy tego od prawdziwego spadku i wzrostu. Model sam tego nie naprawi.','General algebra, not an identified row in this dataset: replacing missing xₜ with zero creates boundary differences 0 − xₜ₋₁ and xₜ₊₁ − 0. Without a mask we cannot distinguish this from a real fall and rise. A model cannot repair it on its own.')+'</p></details>';
 case 1:return '<p class="eyebrow">'+t('02 / Co się zmieniło?','02 / What changed?')+'</p><h2>447 → 448 · cursor: pin S wait on X</h2><div class="equation">'+n(D.x[i+1][j])+' − '+n(D.x[i][j])+' = '+n(dx)+' s</div><p>'+t('Odejmujemy poprzednie okno od następnego. Pytamy o zmianę poziomu oczekiwania — nie o największą sumę w całym raporcie. To suma sekund oczekiwania, nie czas zegarowy okna.','Subtract the previous window from the next. We ask about the change in waiting, not the biggest total in the report. These are summed wait seconds, not the window’s wall-clock duration.')+'</p><div class="equation">Δ AAS = '+n(D.y[i+1])+' − '+n(D.y[i])+' = '+n(dy)+'</div><p>'+t('Cel zmienił się o tyle aktywnych sesji średnio. AAS i sekundy oczekiwania mają inne jednostki; nie dodajemy tych osi.','That is the change in average active sessions. AAS and wait seconds have different units; we do not add these axes.')+'</p>';
 case 2:return '<p class="eyebrow">'+t('03 / Wspólny język wielkości','03 / A common language of scale')+'</p><h2>'+t('Najpierw wyjaśnienie. Potem litera z.','Meaning first. The letter z second.')+'</h2><p>'+t('Od zmiany odejmujemy średnią zmian. Wynik dzielimy przez odchylenie standardowe zmian: typową skalę ich rozrzutu. To przygotowanie modelu, nie samo rozciągnięcie wykresu.','Subtract the mean change, then divide by the sample standard deviation: a scale of spread. This prepares the model; it is not merely stretching a chart.')+'</p><div class="equation">z = ('+n(dx)+' − '+n(P.mean[j],5)+') / '+n(P.sd[j],5)+' = '+n(z,5)+'</div><div class="calc-grid"><div class="calc-cell"><span>'+t('średnia Δx','mean Δx')+'</span><b>'+n(P.mean[j],5)+' s</b></div><div class="calc-cell"><span>'+t('odchylenie próby','sample deviation')+'</span><b>'+n(P.sd[j],2)+' s</b></div><div class="calc-cell"><span>'+t('wynik bez jednostki','unitless result')+'</span><b>'+n(z,5)+'</b></div></div><p>'+t('Średnia i skala pochodzą z 1 338 różnic. W wariancji próbki dzielimy sumę kwadratów odchyleń przez N−1 = 1 337.','Mean and scale come from 1,338 differences. Sample variance divides the sum of squared deviations by N−1 = 1,337.')+'</p>'+notice('z ≈ 12,57 oznacza zmianę ponad dwanaście takich skal od średniej. To duży skok wejścia, nie „12 razy więcej AAS”. Huber ogranicza reakcję na duży błąd przewidywania, ale nie daje pełnej ochrony przed skrajną wartością samej cechy.','z ≈ 12.57 means a change more than twelve such scales from the mean. It is a large input jump, not “12 times more AAS”. Huber limits the response to large prediction errors, but does not fully protect against extreme predictor values.');
 case 3:return modelCards();
 case 4:return '<p class="eyebrow">'+t('05 / Bramka zbieżności','05 / Convergence gate')+'</p><h2>'+t('Nie zbiegł? Nie głosuje.','Didn’t converge? No vote.')+'</h2><div class="model-grid">'+Object.keys(labels).map(m=>'<div class="model-tile '+(!D.fitStatus[m].converged?'blocked':'')+'"><h3>'+labels[m]+'</h3><span class="tag">'+(D.fitStatus[m].converged?t('ZBIEŻNY','CONVERGED'):'STOP')+'</span><p>'+(D.fitStatus[m].iterations?count(D.fitStatus[m].iterations,{one:'iteracja',few:'iteracje',many:'iteracji',other:'iteracji'},'iteration'):t('rozwiązany układ','solved system'))+'</p></div>').join('')+'</div><blockquote class="gate-quote">'+t('„Q95: jeszcze jedna iteracja i mam odpowiedź! Barman: stary, my już krzesła na stoły stawiamy.”','“Q95: one more iteration and I’ve got it! Bartender: mate, the chairs are already on the tables.”')+'</blockquote><p>'+t('Po 20 000 iteracji Q95 nie spełnił swoich kryteriów zakończenia. Możemy obejrzeć liczby z chwili zatrzymania, ale nie dopuszczamy ich do wspólnej kwalifikacji. Nie jest to dowód, że dane są złe. Zbieżność pozostałych modeli oznacza zakończenie obliczeń według kryterium — nie potwierdzenie jakości danych ani przyczynowości.','After 20,000 iterations Q95 had not met its stopping criteria. We can inspect its last numbers, but they cannot enter the combined classification. This does not prove the data are bad. Convergence of the other fits means they met their numerical criteria, not that data quality or causality has been established.')+'</p>';
 default:return '<p class="eyebrow">'+t('06 / Etykieta jest częścią wyniku','06 / The label is part of the result')+'</p><h2>'+t('Destylat z odnośnikiem do beczki.','A distillate with a route back to the barrel.')+'</h2><div class="package-comparison"><div><b>'+n(rawBytes/1000,1)+' kB</b><span class="subtle">'+t('macierz liczb w JSON','numerical matrix in JSON')+'</span></div><span class="arrow">→</span><div><b>'+n(by(JSON.stringify(packet()))/1000,1)+' kB</b><span class="subtle">'+t('pakiet dowodów w JSON','evidence packet in JSON')+'</span></div></div><p>'+t('To zmierzone bajty dwóch konkretnych reprezentacji. Nie współczynnik kompresji całego AWR, nie pomiar tokenów, nie obietnica oszczędności. Podsumowanie jest stratne: nie odtworzysz z niego pomiarów. Wrócisz po nie do zachowanego źródła.','These are measured bytes of two specific representations. Not a full-AWR compression ratio, a token count, or promised savings. The summary is lossy: it cannot reconstruct the measurements. Retrieve them from the retained source.')+'</p><p>'+t('Pakiet zawiera zakres, transformacje, współczynniki, braki, zbieżność, punkt wejścia i następne żądanie dowodu. Wątpliwości jadą razem z liczbami.','The packet carries scope, transformations, coefficients, missingness, convergence, an entry point and the next evidence request. Doubts travel with the numbers.')+'</p>';
}}

 $('calc-content').onclick=e=>{const b=e.target.closest('[data-explain-model]');if(b&&$('calc-content').contains(b))showModelExplanation(b.dataset.explainModel);};
 const svg=$('apparatus');svg.querySelector('text:last-child').textContent=t('CZTERY MODELE. RÓŻNE PYTANIA. ŻADNYCH WYROKÓW.','FOUR MODELS. DIFFERENT QUESTIONS. NO VERDICTS.');
 const desktop=document.createElement('div');desktop.className='desktop-flow';svg.replaceWith(desktop);desktop.append(svg);const mobile=document.createElement('div');mobile.className='mobile-flow';mobile.innerHTML=mobileApparatus();desktop.after(mobile);
 document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{state.stage=+b.dataset.stage;document.querySelectorAll('[data-stage]').forEach(x=>x.setAttribute('aria-pressed',String(+x.dataset.stage===state.stage)));$('calc-content').innerHTML=calcContent();});
 $('play-flow').onclick=()=>{clearTimeout(flowTimer);const diagrams=document.querySelectorAll('.distill-svg');$('flow-status').textContent=state.reduce?t('Pomiary → różnice → skala → modele → kontrola. Ruch ograniczony: pokazujemy nieruchomy schemat.','Readings → changes → scale → models → checks. Reduced motion: showing a static diagram.'):t('Śledź drogę liczb. Objaśnienia kroków otwierasz zaworami poniżej.','Follow the numbers. Open each explanation with the valves below.');diagrams.forEach(s=>{s.classList.remove('running');void s.getBoundingClientRect();s.classList.add('running');});$('announcement').textContent=t('Pomiary pozostają lokalne. Cztery dopasowania; Q95 zatrzymany w bramce.','Measurements stay local. Four fits; Q95 stopped at the gate.');flowTimer=setTimeout(()=>diagrams.forEach(s=>s.classList.remove('running')),6200);};

function modelCards(){
 return '<p class="eyebrow">'+t('04 / Cztery sposoby zadawania pytań','04 / Four ways to ask questions')+'</p><p>'+t('Kliknij model. Wyjaśnimy go przy piwie — bez zakładania, że znasz wzory.','Click a model. We’ll explain it over a beer — no formulas assumed.')+'</p><div class="model-grid">'+Object.keys(labels).map(key=>{const c=window.ModelExplanations.get(key,state.lang,D,P);return '<button type="button" class="model-tile model-explain" data-explain-model="'+key+'" aria-haspopup="dialog" aria-controls="model-dialog"><span class="model-name">'+esc(c.name)+'</span><span class="model-teaser">'+esc(c.teaser)+'</span><span class="model-invite"><span aria-hidden="true">🍺</span> '+esc(c.explain)+' <span aria-hidden="true">↗</span></span></button>';}).join('')+'</div><p>'+t('Ridge liczymy teraz w przeglądarce. Wyniki trzech pozostałych modeli zachowano z wcześniejszych obliczeń tych samych danych. Każdy patrzy na problem inaczej. „Przewidywanie” oznacza tu oszacowanie zmiany AAS z równoczesnych zmian oczekiwań, nie prognozę przyszłości. Badamy ten sam zbiór, na którym dopasowano modele; nie jest to test trafności na nowych danych.','Ridge runs in the browser now. The other three results were retained from earlier calculations on these same data. Each takes a different view. “Prediction” here means estimating AAS change from simultaneous wait changes, not forecasting the future. We inspect the same data used for fitting; this is not an accuracy test on unseen data.')+'</p>';
}
